<!doctype html>
<html lang="vi" data-composition-variables='[
  {"id":"quote","type":"string","label":"Câu trích dẫn","default":"Hãy sống như thể ngày mai bạn sẽ chết, hãy học như thể bạn sẽ sống mãi."},
  {"id":"author","type":"string","label":"Tác giả","default":"Mahatma Gandhi"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Trích dẫn</title>
<style>
  @font-face { font-family: "Be Vietnam Pro"; src: url("assets/fonts/BeVietnamPro-ExtraBold.ttf") format("truetype"); font-weight: 800; }
  @font-face { font-family: "Be Vietnam Pro"; src: url("assets/fonts/BeVietnamPro-SemiBold.ttf") format("truetype"); font-weight: 600; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: #0e2a47; font-family: "Be Vietnam Pro", sans-serif; color: #ffffff;
  }
  #stage { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.85; }
  #blob-a { width: 900px; height: 900px; left: -300px; top: -200px; background: #3a7bd5; animation: orbit-a 10s ease-in-out 0s both; }
  #blob-b { width: 800px; height: 800px; right: -320px; top: 700px; background: #8e44ad; animation: orbit-b 10s ease-in-out 0s both; }
  #blob-c { width: 700px; height: 700px; left: 100px; bottom: -380px; background: #16a085; animation: orbit-a 10s ease-in-out 0s reverse both; }
  #card { position: absolute; left: 90px; right: 90px; top: 50%; transform: translateY(-50%); }
  #mark { font-weight: 800; font-size: 300px; line-height: 0.8; color: rgba(255, 255, 255, 0.75); height: 200px; }
  #quote { font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35); }
  #author { margin-top: 56px; font-weight: 600; font-size: 52px; color: rgba(255, 255, 255, 0.85); }
  #author::before { content: "— "; }
  #author.empty { display: none; }
  @keyframes orbit-a { 0% { transform: translate(0, 0); } 50% { transform: translate(260px, 320px); } 100% { transform: translate(120px, 80px); } }
  @keyframes orbit-b { 0% { transform: translate(0, 0); } 50% { transform: translate(-280px, -260px); } 100% { transform: translate(-80px, -400px); } }
  @keyframes rise { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
<div id="root" data-composition-id="trich-dan" data-start="0" data-duration="10" data-width="1080" data-height="1920" data-no-timeline>
  <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0">
    <div id="blob-a" class="blob" data-layout-allow-overflow></div>
    <div id="blob-b" class="blob" data-layout-allow-overflow></div>
    <div id="blob-c" class="blob" data-layout-allow-overflow></div>
    <div id="card">
      <div id="mark">“</div>
      <h1 id="quote"></h1>
      <p id="author"></p>
    </div>
  </div>
  <audio id="music" data-start="0" data-duration="10" data-volume="0.6" data-fade-in="0.5" data-fade-out="1.5" src="assets/music/chillin-poupi.m4a"></audio>
</div>
<script src="scripts/common.js"></script>
<script src="scripts/trich-dan.js"></script>
</body>
</html>
