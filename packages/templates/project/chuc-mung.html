<!doctype html>
<html lang="vi" data-composition-variables='[
  {"id":"line1","type":"string","label":"Dòng 1","default":"Chúc mừng sinh nhật!"},
  {"id":"line2","type":"string","label":"Dòng 2","default":"Tuổi mới thật nhiều niềm vui"},
  {"id":"line3","type":"string","label":"Dòng 3","default":"Yêu thương thật nhiều!"},
  {"id":"photo1","type":"string","label":"Ảnh 1","default":""},
  {"id":"photo2","type":"string","label":"Ảnh 2","default":""},
  {"id":"photo3","type":"string","label":"Ảnh 3","default":""}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Chúc mừng</title>
<style>
  @font-face { font-family: "Be Vietnam Pro"; src: url("assets/fonts/BeVietnamPro-ExtraBold.ttf") format("truetype"); font-weight: 800; }
  @font-face { font-family: "Be Vietnam Pro"; src: url("assets/fonts/BeVietnamPro-SemiBold.ttf") format("truetype"); font-weight: 600; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(160deg, #9d174d 0%, #6d28d9 55%, #9a3412 100%);
    font-family: "Be Vietnam Pro", sans-serif; color: #ffffff;
  }
  #stage { position: absolute; inset: 0; }
  .glow { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.1); }
  #glow-a { width: 760px; height: 760px; left: -220px; top: -160px; animation: drift 12s ease-in-out 0s both; }
  #glow-b { width: 620px; height: 620px; right: -200px; bottom: -120px; animation: drift 12s ease-in-out 0s reverse both; }
  .confetti { position: absolute; top: -60px; width: 22px; height: 38px; border-radius: 6px; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  #scene-1 { opacity: 1; }
  .polaroid {
    position: absolute; left: 150px; top: 300px; width: 780px; height: 900px; padding: 34px 34px 150px;
    background: #fffaf3; border-radius: 22px; box-shadow: 0 40px 90px rgba(120, 30, 60, 0.35);
  }
  .polaroid img, .tile img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
  .polaroid .empty, .tile .empty { width: 100%; height: 100%; border-radius: 12px; background: linear-gradient(135deg, #ffd6e7, #ffe7c2); }
  #photo-a { transform: rotate(-4deg); }
  #photo-b { transform: rotate(3deg); }
  .line {
    position: absolute; left: 70px; right: 70px; bottom: 300px; text-align: center; font-weight: 800; line-height: 1.15;
    text-shadow: 0 6px 24px rgba(120, 30, 60, 0.45); overflow-wrap: anywhere;
  }
  #collage { position: absolute; left: 90px; right: 90px; top: 250px; height: 900px; }
  .tile { position: absolute; width: 470px; height: 560px; padding: 22px; background: #fffaf3; border-radius: 20px; box-shadow: 0 30px 70px rgba(120, 30, 60, 0.3); }
  #tile-1 { left: 0; top: 40px; transform: rotate(-6deg); }
  #tile-2 { right: 0; top: 0; transform: rotate(5deg); }
  #tile-3 { left: 215px; top: 340px; transform: rotate(-1deg); }
  #line3 { bottom: 260px; }
  @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(90px, 140px) scale(1.12); } 100% { transform: translate(0, 60px) scale(1); } }
  @keyframes fall { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(2100px) rotate(720deg); } }
  @keyframes scene-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scene-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes pop { 0% { transform: scale(0.82) rotate(-8deg); opacity: 1; } 70% { transform: scale(1.05) rotate(var(--tilt, 0deg)); opacity: 1; } 100% { transform: scale(1) rotate(var(--tilt, 0deg)); opacity: 1; } }
  @keyframes rise { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div id="root" data-composition-id="chuc-mung" data-start="0" data-duration="12" data-width="1080" data-height="1920" data-no-timeline>
  <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0">
    <div id="glow-a" class="glow" data-layout-allow-overflow></div>
    <div id="glow-b" class="glow" data-layout-allow-overflow></div>
    <div id="confetti"></div>
    <section id="scene-1" class="scene">
      <div id="photo-a" class="polaroid"></div>
      <h1 id="line1" class="line"></h1>
    </section>
    <section id="scene-2" class="scene">
      <div id="photo-b" class="polaroid"></div>
      <h1 id="line2" class="line"></h1>
    </section>
    <section id="scene-3" class="scene">
      <div id="collage"></div>
      <h1 id="line3" class="line"></h1>
    </section>
  </div>
  <audio id="music" data-start="0" data-duration="12" data-volume="0.7" data-fade-in="0.3" data-fade-out="1.5" src="assets/music/fetch-dance.m4a"></audio>
</div>
<script src="scripts/common.js"></script>
<script src="scripts/chuc-mung.js"></script>
</body>
</html>
