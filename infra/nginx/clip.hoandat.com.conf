# .65: /etc/nginx/conf.d/clip.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here. The web app is static
# (the build in /var/www/clip/app/apps/web/dist); /api, /auth and /healthz go to the Node server on loopback :4840.
# Videos never stream through Node: the server checks the account owns the job, then answers with
# X-Accel-Redirect to the internal /_clip_media/ location below and nginx sends the file.

server {
    listen 80;
    listen [::]:80;
    server_name clip.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clip.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/clip.hoandat.com.access.log;
    error_log  /var/log/nginx/clip.hoandat.com.error.log;

    root /var/www/clip/app/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json;

    # Small bodies everywhere; only the render request carries photos (3 × 5 MB, plus the form).
    client_max_body_size 64k;

    # No inline script, no CDN: the preview frame (srcdoc) inherits this policy and loads the hyperframes runtime
    # and the compositions from /tpl/. Inline styles: the preview player's shadow DOM and the compositions use them.
    # Photos picked for the preview are blob: URLs. Checked in Chrome against the production build.
    set $clip_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location = /healthz {
        proxy_pass http://127.0.0.1:4840;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:4840;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/jobs {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:4840;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4840;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Reached only through X-Accel-Redirect from the server, after its ownership check. nginx keeps the
    # server's Content-Type and Content-Disposition.
    location /_clip_media/videos/ {
        internal;
        alias /var/www/clip/media/videos/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Vite fingerprints everything under /assets/: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $clip_csp always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Compositions, their fonts and music, the hyperframes runtime: fixed names, a day is enough.
    location /tpl/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy $clip_csp always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The single-page app: every other path is index.html, never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $clip_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
